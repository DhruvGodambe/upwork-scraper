[project]
name = "upwork-scraper"
version = "2.0.0"
description = "A resilient one-shot scraper for Upwork Best Matches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "selenium>=4.18,<5",
    "undetected-chromedriver>=3.5.5,<4",
]

[project.scripts]
upwork-scraper = "upwork_scraper.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["upwork_scraper*"]

[dependency-groups]
dev = [
    "mypy>=1.10,<2",
    "pre-commit>=3,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
